<!doctype html><meta charset="utf-8"><title>proto</title>
<style>body{background:#fff;margin:20px;font-family:sans-serif}.row{display:flex;gap:16px;align-items:center;margin:6px 0}.row small{width:70px}
.live{font-size:110px;width:900px;position:relative}.live3d{display:block}</style>
<div class="live" id="live"></div>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="../assets/fonts/fredoka.js"></script><script src="baloo.js"></script><script src="titan.js"></script><script src="rubik.js"></script>
<script src="../assets/js/puffy3d.js"></script>
<script>
const out=document.getElementById('out'), t0=performance.now();
for (const f of ['fredoka','baloo','titan','rubik']) {
  const row=document.createElement('div'); row.className='row'; row.innerHTML='<small>'+f+'</small>';
  for (const [w,c] of [['Thank','plum'],['You','teal'],['Pups!','pink']]) { const r=HPP3D.word(w,{color:HPP3D.colors[c],px:90,fontName:f}); r.canvas.style.height=(r.em.h*90)+'px'; row.append(r.canvas); }
  out.append(row);
}
document.title='proto '+Math.round(performance.now()-t0)+'ms';
const L=HPP3D.live(document.getElementById('live'),[{text:'A',color:HPP3D.colors.plum},{text:'palace',color:HPP3D.colors.plum},{text:'to',color:HPP3D.colors.plum},{text:'play.',color:HPP3D.colors.teal}]); L.start();
</script>
