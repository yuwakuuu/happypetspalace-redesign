<!doctype html><meta charset="utf-8"><title>fur</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>body{background:#fff;margin:20px}.row{display:flex;gap:6px;align-items:flex-end;margin:10px 0}</style>
<div id="out"></div>
<script src="../assets/js/fur.js"></script>
<script>
(async()=>{ await document.fonts.load('700 100px Fredoka'); const t0=performance.now();
const out=document.getElementById('out');
for (const [words,hue,px] of [[['fluffy','pups!'],'pink',120],[['needs.'],'teal',100],[['365'],'butter',110],[['Ready','for','playtime?'],'white',90]]) {
  const row=document.createElement('div'); row.className='row'; if(hue==='white') row.style.background='#521034';
  for (const w of words){ const r=HPP3D.fur(w,{px,hue}); r.canvas.style.height=(r.em.h*px)+'px'; row.append(r.canvas);} out.append(row);}
document.title='fur '+Math.round(performance.now()-t0)+'ms';})();
</script>
